[package]
name = "focus-companion"
version = "0.1.0"
description = "Standalone macOS task orchestrator and computer-use companion powered by Ollama"
authors = ["Focus Companion"]
edition = "2021"

[lib]
name = "focus_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
xcap = "0.9"
active-win-pos-rs = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
parking_lot = "0.12"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSDictionary", "NSError", "NSGeometry", "NSString"] }
objc2-core-foundation = { version = "0.3", features = ["CFBase", "CFData", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", features = ["CGImage", "CGDataProvider", "CGColorSpace", "CGWindow", "CGEvent", "CGEventSource", "CGEventTypes", "CGRemoteOperation", "objc2"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPanel", "NSWindow", "NSResponder", "NSScreen", "NSEvent", "NSGraphics", "NSColor", "NSView", "objc2-core-foundation"] }
objc2-vision = { version = "0.3", features = ["VNObservation", "VNRequest", "VNRequestHandler", "VNRecognizeTextRequest", "objc2-core-graphics"] }
